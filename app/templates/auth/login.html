{% extends 'base.html' %}

{% block title %}Sign In — Employee Support Ticket System{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-card-icon" aria-hidden="true">&#128274;</div>
        <h2>Welcome Back</h2>
        <p class="login-subtitle">Sign in to access the support portal.</p>

        <form method="POST" action="{{ url_for('auth.login') }}" class="login-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       class="form-control" required autofocus
                       autocomplete="username"
                       placeholder="Enter your username"
                       aria-required="true">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       class="form-control" required
                       autocomplete="current-password"
                       placeholder="Enter your password"
                       aria-required="true">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
