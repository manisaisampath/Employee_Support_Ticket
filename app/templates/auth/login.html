{% extends 'base.html' %}

{% block title %}Sign In - Employee Support Ticket System{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h2>Sign In</h2>
        <p class="login-subtitle">Please enter your credentials to access the support portal.</p>
        
        <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
